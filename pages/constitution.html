<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Constitution | Fi Sabilillah</title>
  <link rel="icon" type="image/png" href="../public/images/favicon.png">
  <meta name="description" content="Fi Sabilillah - Constitution: Full organizational charter with 8 chapters and 16 articles.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#f0fdf7', 100: '#dcfce9', 200: '#bbf7d2', 300: '#86efae', 400: '#4ade80', 500: '#22c55e', 600: '#16a34a', 700: '#0d5c46', 800: '#0b4737', 900: '#073327', 950: '#031c15' },
            gold: { 50: '#fbf9f2', 100: '#f5f0df', 200: '#ebdebc', 300: '#dec793', 400: '#cfa964', 500: '#c5a059', 600: '#b08745', 700: '#8c6835', 800: '#71532f', 900: '#5e452a' }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Hind Siliguri"', 'sans-serif'],
            bengali: ['"Hind Siliguri"', 'sans-serif'],
            arabic: ['"Amiri"', 'serif'],
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="../src/css/style.css">
  <link rel="stylesheet" href="../src/css/responsive.css">
  <link rel="stylesheet" href="../src/css/animations.css">
</head>
<body class="min-h-screen text-slate-800 antialiased">

  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <nav id="main-navbar" class="sticky top-0 z-50 transition-all duration-300">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
    
    <!-- Logo & Organization Name -->
    <a href="../index.html" class="navbar-home flex items-center gap-3 group focus:outline-none focus:ring-2 focus-ring-brand-700/20 rounded-xl p-1">
      <div class="relative w-10 h-10 rounded-full p-0.5 bg-white shadow-sm ring-1 ring-slate-200/80 overflow-hidden flex items-center justify-center">
        <img src="../public/images/logo.png" alt="Fi Sabilillah Logo" class="w-full h-full object-cover">
      </div>
      <div class="flex flex-col">
        <span class="text-sm font-bold tracking-tight text-slate-900 group-hover:text-brand-700 transition flex items-center gap-1.5">
          Fi Sabilillah
          <span class="text-[10px] font-normal text-gold-600 font-bengali bg-gold-50 px-1 py-0.5 rounded border border-gold-200/50">ফি সাবিলিল্লাহ</span>
        </span>
        <span class="text-[10px] font-medium text-slate-500 uppercase tracking-wider" data-i18n="nav_tagline">Non-Profit & Voluntary Org</span>
      </div>
    </a>

    <!-- Desktop Navigation Links -->
    <nav class="flex items-center gap-1 xl:gap-2" id="desktop-nav">
      <a href="../index.html" class="nav-link px-3 py-2 text-sm font-medium text-slate-600 hover:text-brand-700 rounded-lg hover:bg-white/60 transition" data-i18n="nav_home">Home</a>
      <div class="relative group">
        <button class="nav-link px-3 py-2 text-sm font-medium text-slate-600 hover:text-brand-700 rounded-lg hover:bg-white/60 transition flex items-center gap-1" aria-haspopup="true" aria-expanded="false">
          <span data-i18n="nav_about">About Us</span>
          <svg class="w-3 h-3 ml-1 text-slate-400 transition-transform group-hover:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
        </button>
        <div class="absolute hidden top-full left-0 mt-2 w-56 bg-white border border-slate-200 rounded-xl shadow-lg py-2 z-50" aria-label="About Us submenu">
          <button class="dropdown-item w-full px-4 py-2 text-xs text-left text-slate-600 hover:bg-brand-50 hover:text-brand-700 transition" data-i18n="nav_who_we_are">Who We Are</button>
          <button class="dropdown-item w-full px-4 py-2 text-xs text-left text-slate-600 hover:bg-brand-50 hover:text-brand-700 transition" data-i18n="nav_vision_mission">Vision & Mission</button>
          <button class="dropdown-item w-full px-4 py-2 text-xs text-left text-slate-600 hover:bg-brand-50 hover:text-brand-700 transition" data-i18n="nav_core_values">Core Values</button>
        </div>
      </div>
      <a href="programs.html" class="nav-link px-3 py-2 text-sm font-medium text-slate-600 hover:text-brand-700 rounded-lg hover:bg-white/60 transition" data-i18n="nav_programs">Our Programs</a>
      <div class="relative group">
        <button class="nav-link px-3 py-2 text-sm font-medium text-slate-600 hover:text-brand-700 rounded-lg hover:bg-white/60 transition flex items-center gap-1" aria-haspopup="true" aria-expanded="false">
          <span data-i18n="nav_governance">Governance</span>
          <svg class="w-3 h-3 ml-1 text-slate-400 transition-transform group-hover:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
        </button>
        <div class="absolute hidden top-full left-0 mt-2 w-56 bg-white border border-slate-200 rounded-xl shadow-lg py-2 z-50" aria-label="Governance submenu">
          <button class="dropdown-item w-full px-4 py-2 text-xs text-left text-slate-600 hover:bg-brand-50 hover:text-brand-700 transition" data-i18n="nav_org_structure">Organizational Structure</button>
          <button class="dropdown-item w-full px-4 py-2 text-xs text-left text-slate-600 hover:bg-brand-50 hover:text-brand-700 transition" data-i18n="nav_exec_council">Executive Council</button>
          <button class="dropdown-item w-full px-4 py-2 text-xs text-left text-slate-600 hover:bg-brand-50 hover:text-brand-700 transition" data-i18n="nav_membership">Membership</button>
        </div>
      </div>
      <div class="relative group">
        <button class="nav-link px-3 py-2 text-sm font-medium text-slate-600 hover:text-brand-700 rounded-lg hover:bg-white/60 transition flex items-center gap-1" aria-haspopup="true" aria-expanded="false">
          <span data-i18n="nav_resources">Resources</span>
          <svg class="w-3 h-3 ml-1 text-slate-400 transition-transform group-hover:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
        </button>
        <div class="absolute hidden top-full left-0 mt-2 w-56 bg-white border border-slate-200 rounded-xl shadow-lg py-2 z-50" aria-label="Resources submenu">
          <button class="dropdown-item w-full px-4 py-2 text-xs text-left text-slate-600 hover:bg-brand-50 hover:text-brand-700 transition" data-i18n="nav_constitution">Constitution</button>
          <button class="dropdown-item w-full px-4 py-2 text-xs text-left text-slate-600 hover:bg-brand-50 hover:text-brand-700 transition" data-i18n="nav_transparency">Transparency</button>
          <button class="dropdown-item w-full px-4 py-2 text-xs text-left text-slate-600 hover:bg-brand-50 hover:text-brand-700 transition" data-i18n="nav_activities">Activities & Updates</button>
        </div>
      </div>
      <a href="contact.html" class="nav-link px-3 py-2 text-sm font-medium text-slate-600 hover:text-brand-700 rounded-lg hover:bg-white/60 transition" data-i18n="nav_contact">Contact</a>
    </nav>

    <!-- Right Action Items -->
    <div class="flex items-center gap-3">
      <button id="lang-toggle-btn" class="px-3 py-1.5 text-xs font-semibold text-slate-700 hover:text-brand-700 flex items-center gap-1.5 rounded-full transition border border-slate-200/60 bg-white/80 backdrop-blur-md" title="Toggle Language (English / বাংলা)">
        <svg class="w-3.5 h-3.5 text-brand-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"></path></svg>
        <span id="current-lang-label">বাংলা</span>
      </button>
      <button id="nav-apply-btn" class="px-4 py-2 text-xs font-semibold bg-brand-700 text-white rounded-xl flex items-center gap-1.5 cursor-pointer shadow-md hover:bg-brand-800 transition">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>
        <span data-i18n="nav_cta_apply">Join / Apply</span>
      </button>
    </div>

    <!-- Mobile Menu Button -->
    <div class="flex items-center gap-2 lg:hidden">
      <button id="mobile-lang-btn" class="px-2.5 py-1 text-xs font-semibold text-slate-700 rounded-full border border-slate-200/60 bg-white/80 backdrop-blur-md">
        <span id="mobile-lang-label">বাংলা</span>
      </button>
      <button id="mobile-menu-toggle" class="p-2 rounded-xl text-slate-700 hover:bg-white/80 transition" aria-label="Toggle mobile menu" aria-expanded="false" aria-controls="mobile-menu-drawer">
        <svg id="menu-icon-bars" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
        <svg id="menu-icon-close" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>
  </div>

  <!-- Mobile Drawer Navigation -->
  <div id="mobile-menu-drawer" class="hidden lg:hidden border-t border-slate-200 bg-white/95 backdrop-blur-xl px-6 py-6 shadow-xl">
    <div class="flex flex-col gap-3">
      <!-- Populated by JS -->
    </div>
  </div>
</nav>

  <main class="relative z-10">

    <!-- Page Header -->
    <section class="py-8 md:py-12 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto">
      <div class="text-center mb-8">
        <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-brand-50 text-brand-800 text-xs font-semibold mb-3 border border-brand-100">
          <span data-i18n="sec_const_tag">Full Organizational Charter</span>
        </div>
        <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight" data-i18n="constitution_title">Constitution</h1>
        <p class="mt-3 text-slate-600 text-sm sm:text-base" data-i18n="constitution_desc">
          Complete transparent governance document comprising 8 chapters and 16 articles, enacted by our founding members.
        </p>
      </div>
    </section>

    <!-- Constitution Reader Layout -->
    <section class="py-12 md:py-16 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto">
      <div class="flex flex-col lg:flex-row gap-8 min-h-[600px]">

        <!-- Left Sidebar: Navigation -->
        <div class="lg:w-1/4 flex flex-col gap-4">
          <!-- Search -->
          <div class="bg-white/60 rounded-2xl p-4 sm:p-5 border border-white/60 shadow-sm sticky top-4">
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
              </div>
              <input type="text" id="const-search-input" placeholder="Search articles, keywords, roles..." data-i18n="constitution_search_placeholder" class="glass-input w-full pl-9 pr-4 py-2 text-xs sm:text-sm rounded-xl text-slate-800 placeholder-slate-400">
            </div>
            <div class="mt-3 flex items-center gap-2 overflow-x-auto pb-1 no-scrollbar">
              <button id="show-all-articles-btn" class="glass-pill px-3 py-1.5 rounded-lg text-xs font-semibold text-brand-800 hover:bg-brand-50 transition whitespace-nowrap active-chip" data-i18n="btn_all_chapters">All 8 Chapters</button>
              <button id="print-constitution-btn" class="glass-pill px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-700 hover:text-slate-900 transition whitespace-nowrap flex items-center gap-1 ml-auto" title="Print Constitution">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                <span data-i18n="constitution_print">Print</span>
              </button>
            </div>
          </div>

          <!-- Chapter Tabs -->
          <div class="bg-white/60 rounded-2xl p-4 sm:p-5 border border-white/60 shadow-sm sticky top-[140px] flex-1 overflow-y-auto">
            <div class="flex gap-2 overflow-x-auto pb-3 mb-6 no-scrollbar" id="chapter-tabs-container">
              <button class="chap-tab px-4 py-2 rounded-xl text-xs font-semibold glass-pill whitespace-nowrap bg-brand-700 text-white" data-chap="all" data-i18n="constitution_all_chapters">All Chapters</button>
              <button class="chap-tab px-4 py-2 rounded-xl text-xs font-semibold glass-pill whitespace-nowrap text-slate-700 hover:text-brand-700" data-chap="1" data-i18n="chap_1">Ch 1: Identity</button>
              <button class="chap-tab px-4 py-2 rounded-xl text-xs font-semibold glass-pill whitespace-nowrap text-slate-700 hover:text-brand-700" data-chap="2" data-i18n="chap_2">Ch 2: Vision & Mission</button>
              <button class="chap-tab px-4 py-2 rounded-xl text-xs font-semibold glass-pill whitespace-nowrap text-slate-700 hover:text-brand-700" data-chap="3" data-i18n="chap_3">Ch 3: Membership</button>
              <button class="chap-tab px-4 py-2 rounded-xl text-xs font-semibold glass-pill whitespace-nowrap text-slate-700 hover:text-brand-700" data-chap="4" data-i18n="chap_4">Ch 4: Governance</button>
              <button class="chap-tab px-4 py-2 rounded-xl text-xs font-semibold glass-pill whitespace-nowrap text-slate-700 hover:text-brand-700" data-chap="5" data-i18n="chap_5">Ch 5: Meetings & Elections</button>
              <button class="chap-tab px-4 py-2 rounded-xl text-xs font-semibold glass-pill whitespace-nowrap text-slate-700 hover:text-brand-700" data-chap="6" data-i18n="chap_6">Ch 6: Finance & Audit</button>
              <button class="chap-tab px-4 py-2 rounded-xl text-xs font-semibold glass-pill whitespace-nowrap text-slate-700 hover:text-brand-700" data-chap="7" data-i18n="chap_7">Ch 7: Amendments</button>
              <button class="chap-tab px-4 py-2 rounded-xl text-xs font-semibold glass-pill whitespace-nowrap text-slate-700 hover:text-brand-700" data-chap="8" data-i18n="chap_8">Ch 8: Dissolution</button>
            </div>

            <!-- Article Quick Nav -->
            <div class="border-t border-slate-200/60 pt-4">
              <h4 class="text-xs font-bold text-slate-700 uppercase tracking-wider mb-3" data-i18n="constitution_chapter">Chapter Navigation</h4>
              <div class="space-y-1" id="article-quick-nav">
                <!-- Populated by JS -->
              </div>
            </div>
          </div>
        </div>

        <!-- Right Content: Articles -->
        <div class="lg:w-3/4 flex-1">
          <div id="articles-container" class="space-y-4">
            <!-- Injected via JavaScript from constitution.js -->
          </div>
        </div>

      </div>
    </section>

  </main>

  <div id="footer-container"></div>

  <script src="../src/data/constitution.js"></script>
  <script src="../src/js/translations.js"></script>
  <script src="../src/js/main.js"></script>
  <script src="../src/js/components.js"></script>
  <script src="../src/js/navigation.js"></script>
  <script src="../src/js/language.js"></script>
  <script src="../src/js/constitution.js"></script>
</body>
</html>
